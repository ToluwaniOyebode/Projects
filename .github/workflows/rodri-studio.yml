name: Rodri Studio tests
on:
  push:
    paths:
      - 'Project-R.O.D.R.I./studio/**'
      - '.github/workflows/rodri-studio.yml'
  pull_request:
    paths:
      - 'Project-R.O.D.R.I./studio/**'
      - '.github/workflows/rodri-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    defaults:
      run:
        working-directory: Project-R.O.D.R.I./studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies (no model downloads)
        run: python -m pip install 'numpy>=1.26,<3' 'opencv-python>=4.10,<5' 'fastapi>=0.115,<1' 'uvicorn>=0.30,<1' 'python-multipart>=0.0.18,<1' 'scikit-learn>=1.5,<2' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Syntax check
        run: python -m compileall -q rodri_studio run.py
      - name: Unit and API tests
        run: python -m pytest -q
