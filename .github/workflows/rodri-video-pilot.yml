name: RODRI remote video pilot
on:
  push:
    paths:
      - '.github/workflows/rodri-video-pilot.yml'
      - 'Project-R.O.D.R.I./detect_track.py'
      - 'Project-R.O.D.R.I./rodri_identity_gallery.py'
  workflow_dispatch:
    inputs:
      match:
        description: 'Match source'
        required: true
        type: choice
        options:
          - chelsea
          - inter
      start_seconds:
        description: 'Start offset in the full match'
        required: true
        default: '600'
        type: string
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python -m pip install --upgrade pip
          # Use CPU-only PyTorch on GitHub's CPU runner; avoids multi-GB CUDA wheels.
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install opencv-python-headless yt-dlp
          python -m pip install ultralytics
      - name: Choose public match source
        id: source
        shell: bash
        run: |
          MATCH="${{ inputs.match || 'chelsea' }}"
          if [ "$MATCH" = "inter" ]; then
            echo "url=https://www.youtube.com/watch?v=2-vydq64TAA" >> "$GITHUB_OUTPUT"
            echo "name=inter" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://www.youtube.com/watch?v=WkEvdVImkec" >> "$GITHUB_OUTPUT"
            echo "name=chelsea" >> "$GITHUB_OUTPUT"
          fi
          echo "start=${{ inputs.start_seconds || '600' }}" >> "$GITHUB_OUTPUT"
      - name: Download a short segment from the public match
        run: |
          mkdir -p runs/remote_pilot
          START="${{ steps.source.outputs.start }}"
          END=$((START + 75))
          echo "Requested clip range: ${START}s-${END}s"
          yt-dlp --version
          if ! yt-dlp --no-playlist --force-overwrites --retries 2 --fragment-retries 2 --extractor-retries 2 --extractor-args "youtube:player_client=android,web_safari" -f "bv*[height<=360]+ba/b[height<=360]/b" --download-sections "*${START}-${END}" --merge-output-format mp4 -o "runs/remote_pilot/match.%(ext)s" "${{ steps.source.outputs.url }}"; then
            echo "YouTube blocked this runner. Falling back to a small, openly downloadable soccer video for pipeline validation; this is NOT Rodri match footage."
            rm -f runs/remote_pilot/match.*
            curl -fL --retry 3 "https://raw.githubusercontent.com/Divyansh-git10/Soccer-Player-Reid-YOLOV11-Bytetrack/main/15sec_input_720p.mp4" -o runs/remote_pilot/match.mp4
            echo "source_type=generic_soccer_fallback_not_rodri" > runs/remote_pilot/source.txt
          else
            echo "source_type=requested_public_match" > runs/remote_pilot/source.txt
          fi
          VIDEO="$(find runs/remote_pilot -maxdepth 1 -type f -name 'match.*' ! -name '*.json' | head -n 1)"
          test -n "$VIDEO"
          ffprobe -v error -show_entries format=duration,size -of json "$VIDEO" | tee runs/remote_pilot/video_metadata.json
          test "$(stat -c%s "$VIDEO")" -gt 100000
          find runs/remote_pilot -maxdepth 1 -type f -printf '%f %s bytes\n'
      - name: Run person detection and tracking
        run: |
          VIDEO="$(find runs/remote_pilot -maxdepth 1 -type f -name 'match.*' ! -name '*.json' | head -n 1)"
          test -n "$VIDEO"
          python Project-R.O.D.R.I./detect_track.py "$VIDEO" --out runs/remote_pilot/tracking --start 0 --duration 60 --every 8 --imgsz 512 --conf 0.20 --preview
      - name: Build human identity-review gallery
        run: |
          VIDEO="$(find runs/remote_pilot -maxdepth 1 -type f -name 'match.*' ! -name '*.json' | head -n 1)"
          python Project-R.O.D.R.I./rodri_identity_gallery.py "$VIDEO" --detections runs/remote_pilot/tracking/detections.csv --out runs/remote_pilot/identity_gallery
          python Project-R.O.D.R.I./track_features.py runs/remote_pilot/tracking/detections.csv --out runs/remote_pilot/track_features.json
      - name: Save pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rodri-remote-video-pilot
          path: runs/remote_pilot/
          if-no-files-found: warn
          retention-days: 14
